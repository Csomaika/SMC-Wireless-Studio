name: Windows MSI build and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core behavior tests
        run: dotnet run --project tests/Studio.Tests/Studio.Tests.csproj -c Release
      - name: Build self-contained desktop and MSI
        shell: pwsh
        run: ./scripts/Build.ps1 -Output artifacts/release
      - name: Run all desktop views and save screenshots
        shell: pwsh
        run: |
          $env:SMC_SMOKE_DIR = "$pwd/artifacts/screenshots"
          $p = Start-Process "$pwd/artifacts/publish/SMCWirelessStudio.exe" -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Desktop smoke test timed out' }
          if ($p.ExitCode -ne 0) { throw "Desktop smoke test failed: $($p.ExitCode)" }
      - name: Build earlier-version fixture
        shell: pwsh
        run: ./scripts/Build.ps1 -Version 0.0.1 -Output artifacts/baseline
      - name: Test install, update, downgrade block and data preservation
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          ./scripts/Test-Installer.ps1 -OldMsi "$pwd/artifacts/baseline/SMC-Wireless-Studio-0.0.1-x64.msi" -NewMsi "$pwd/artifacts/release/SMC-Wireless-Studio-$version-x64.msi" -Version $version
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-MSI-and-validation
          path: |
            artifacts/release/*.msi
            artifacts/release/*.sha256
            artifacts/screenshots/
            artifacts/installer-tests/
            artifacts/installed-smoke/
          if-no-files-found: warn
      - name: Publish versioned MSI release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Version already published; existing release is unchanged.'; exit 0 }
          gh release create "v$version" "artifacts/release/SMC-Wireless-Studio-$version-x64.msi" "artifacts/release/SMC-Wireless-Studio-$version-x64.msi.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "SMC Wireless Studio $version" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
